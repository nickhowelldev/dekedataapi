version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=DekeData API
      - API_V1_STR=/api/v1
      - ENVIRONMENT=production
      - DATABASE_URL=${DATABASE_URL}
    env_file:
      - .env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 900M
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
